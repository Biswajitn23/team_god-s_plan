<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>आयुसेतु - AyuSetu | Ayurvedic Herb Traceability Portal</title>
    <meta name="description" content="Government of India's official Ayurvedic herb traceability platform for farmers and collectors. Log collection events, generate QR codes, and ensure quality traceability." />
    <meta name="author" content="Government of India - Ministry of AYUSH" />
    <meta name="keywords" content="ayurveda, herbs, traceability, farmers, QR code, government, india, collection, quality" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AyuSetu" />
    <meta name="application-name" content="AyuSetu" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Favicons and Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA Icons for various devices -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    
    <!-- Apple Specific Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png" />

    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="आयुसेतु - AyuSetu | Ayurvedic Herb Traceability Portal" />
    <meta property="og:description" content="Official platform for Ayurvedic herb traceability, collection logging, and quality assurance for Indian farmers and collectors." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:url" content="/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AyuSetu - Ayurvedic Herb Traceability" />
    <meta name="twitter:description" content="Government platform for herb traceability" />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Preload important resources -->
    <link rel="preload" href="/logo.jpg" as="image" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
              
              // Handle updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available
                    if (confirm('New version available! Reload to update?')) {
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Premium Install Prompt Logic
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        const banner = document.createElement('div');
        banner.id = 'pwa-install-banner';
        banner.innerHTML = `
          <div class="banner-glass">
            <div class="banner-content">
              <div class="logo-box">
                <img src="/logo.jpg" alt="AyuSetu">
              </div>
              <div class="text-box">
                <h3>AyuSetu App</h3>
                <p>Install for faster access</p>
              </div>
              <button id="install-btn">Install</button>
              <button id="close-banner">✕</button>
            </div>
          </div>
          <style>
            #pwa-install-banner {
              position: fixed;
              bottom: 80px;
              left: 50%;
              transform: translateX(-50%) translateY(20px);
              opacity: 0;
              pointer-events: none;
              z-index: 9999;
              width: calc(100% - 32px);
              max-width: 400px;
              transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            }
            #pwa-install-banner.show {
              transform: translateX(-50%) translateY(0);
              opacity: 1;
              pointer-events: auto;
            }
            .banner-glass {
              background: rgba(255, 255, 255, 0.8);
              backdrop-filter: blur(20px);
              border: 1px solid rgba(255, 255, 255, 0.4);
              border-radius: 24px;
              padding: 16px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            }
            .banner-content {
              display: flex;
              align-items: center;
              gap: 12px;
            }
            .logo-box {
              width: 48px;
              height: 48px;
              border-radius: 12px;
              overflow: hidden;
              background: white;
            }
            .logo-box img {
              width: 100%;
              height: 100%;
              object-fit: cover;
            }
            .text-box {
              flex: 1;
            }
            .text-box h3 {
              margin: 0;
              font-size: 14px;
              font-weight: 800;
              color: #064e3b;
            }
            .text-box p {
              margin: 0;
              font-size: 11px;
              font-weight: 600;
              color: #064e3b80;
              text-transform: uppercase;
              letter-spacing: 0.5px;
            }
            #install-btn {
              background: #064e3b;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 12px;
              font-size: 13px;
              font-weight: 700;
              cursor: pointer;
            }
            #close-banner {
              background: none;
              border: none;
              color: #064e3b40;
              padding: 8px;
              cursor: pointer;
              font-size: 16px;
            }
          </style>
        `;
        
        const installBtn = banner.querySelector('#install-btn');
        const closeBtn = banner.querySelector('#close-banner');
        
        installBtn.addEventListener('click', () => {
          banner.classList.remove('show');
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
              deferredPrompt = null;
            });
          }
        });
        
        closeBtn.addEventListener('click', () => {
          banner.classList.remove('show');
        });

        // Expose function to show banner
        window.showAyuSetuInstallPrompt = () => {
          // Don't show if already in standalone app mode
          if (window.matchMedia('(display-mode: standalone)').matches) return;
          
          if (deferredPrompt && !banner.classList.contains('show')) {
            document.body.appendChild(banner);
            setTimeout(() => banner.classList.add('show'), 100);
            
            // Auto hide after 5 seconds if not clicked
            setTimeout(() => {
              banner.classList.remove('show');
              // Remove from DOM after fade out
              setTimeout(() => {
                if (banner.parentNode) banner.parentNode.removeChild(banner);
              }, 6000); // Wait for transition
            }, 5000);
          }
        };
      });
    </script>
  </body>
</html>
